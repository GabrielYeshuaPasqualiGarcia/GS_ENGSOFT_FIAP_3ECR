:root{
  --ink:#14283C; --ink-2:#22394F; --ink-3:#3A5269;
  --paper:#EEF2F1; --surface:#FFFFFF; --line:#D3DCDA; --line-2:#E4EAE9;
  --text:#18242E; --muted:#56687A;
  --water:#1C6A86; --water-soft:#E2EFF3;
  --crit:#A3161B; --crit-soft:#F8E3E3;
  --alto:#C2510F; --alto-soft:#FBEBDD;
  --mod:#8A6500; --mod-bg:#F6D36B; --mod-soft:#FBF1D2;
  --baixo:#2D7A4C; --baixo-soft:#E1F1E7;
  --r-panel:6px; --r-chip:3px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--water)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2E8FB3;outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#DCE6EC;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:4px 8px 22px}
.brand b{font-size:1.15rem;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:#9FB3C2;font-weight:400;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;color:#C9D6DF;text-decoration:none;padding:9px 10px;border-radius:5px;font-weight:500}
.nav a svg{flex:none;opacity:.85}
.nav a:hover{background:var(--ink-2);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--ink);font-weight:600}
.nav a[aria-current="page"] svg{opacity:1}
.nav .count{margin-left:auto;background:var(--crit);color:#fff;font-size:.72rem;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;font-size:.75rem;color:#8EA3B3;padding:12px 8px 0;border-top:1px solid var(--ink-2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:1.2rem}
.top .grow{flex:1}
.fresh{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.fresh i{width:9px;height:9px;border-radius:50%;background:var(--baixo);display:inline-block}
.fresh.stale i{background:var(--alto)}
.bell{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.bell span{position:absolute;top:-4px;right:-4px;background:var(--crit);color:#fff;font-size:.7rem;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;font-size:.86rem}
.who select{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--water-soft);color:var(--water);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.content{padding:24px 28px 40px;max-width:1280px;width:100%}
.screen-tag{padding:0 28px 18px;font-size:.75rem;color:var(--muted)}

/* ---------- Building blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel)}
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-h .grow{flex:1}
.panel-b{padding:16px 18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:5px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:.92rem}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.danger{background:#fff;color:var(--crit);border-color:#E2B4B5}
.btn.water{background:var(--water);border-color:var(--water)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.84rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}

.lvl{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;border-radius:var(--r-chip);padding:2px 8px 2px 6px;white-space:nowrap}
.lvl svg{flex:none}
.lvl.critico{background:var(--crit);color:#fff}
.lvl.alto{background:var(--alto);color:#fff}
.lvl.moderado{background:var(--mod-bg);color:#3D2C00}
.lvl.baixo{background:var(--baixo);color:#fff}
.lvl.none{background:var(--line-2);color:var(--muted)}
.state{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:var(--r-chip);padding:1px 8px;color:var(--ink-3);background:#fff;white-space:nowrap}
.state.ativo{border-color:var(--ink);color:var(--ink)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink-3);white-space:nowrap}
.conf{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;white-space:nowrap}
.conf .bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.conf .bars i{width:4px;background:var(--line);border-radius:1px}
.conf .bars i:nth-child(1){height:6px}.conf .bars i:nth-child(2){height:10px}.conf .bars i:nth-child(3){height:14px}
.conf.alta .bars i{background:var(--ink)}
.conf.media .bars i:nth-child(-n+2){background:var(--ink)}
.conf.baixa .bars i:nth-child(1){background:var(--ink)}
.conf b{font-weight:700}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);margin-bottom:18px}
.kpi{padding:14px 18px;border-left:1px solid var(--line-2)}
.kpi:first-child{border-left:0}
.kpi .n{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:.84rem;color:var(--muted)}
.kpi .split{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* Map */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
.map-wrap{position:relative}
.map{width:100%;height:auto;display:block;background:#F7FAF9;border-radius:0 0 var(--r-panel) var(--r-panel)}
.map .dist{fill:#EAF0EE;stroke:#C5D1CE;stroke-width:1}
.map .river{fill:none;stroke:#8FC1D2;stroke-width:5;stroke-linecap:round}
.map .river.thin{stroke-width:3}
.map .road{fill:none;stroke:#D9E1DF;stroke-width:2}
.map text{font-size:12px;fill:#6A7C88;font-family:inherit}
.map text.rn{font-size:11px;fill:#4D8CA3;font-style:italic}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus circle.bg,.mk:hover circle.bg{stroke:#14283C;stroke-width:3}
.mk .pulse{fill:none;stroke:var(--crit);stroke-width:2;transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
@media (prefers-reduced-motion:reduce){.mk .pulse{animation:none;opacity:.6}}
.pop{position:absolute;width:270px;background:#fff;border:1px solid var(--ink);border-radius:6px;padding:12px 14px;box-shadow:0 8px 24px rgba(20,40,60,.18);z-index:3}
.pop h3{margin:6px 0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line-2);font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:.82rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list > li{border-top:1px solid var(--line-2)}
.list > li:first-child{border-top:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 18px;text-decoration:none;color:inherit}
.item:hover{background:#F6F9F8}
.item .t{font-weight:600}
.item .meta{font-size:.82rem;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-size:.8rem;text-align:left;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#F8FAFA;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:.9rem}
tr.click{cursor:pointer}
tr.click:hover td{background:#F6F9F8}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.filters select,.filters input{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:#fff;font-size:.88rem}

/* detail */
.hero{display:flex;gap:18px;align-items:flex-start;padding:20px 22px}
.hero .ic{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;flex:none}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-2)}
.facts > div{padding:14px 22px;border-left:1px solid var(--line-2)}
.facts > div:first-child{border-left:0}
.facts .l{font-size:.8rem;color:var(--muted)}
.facts .v{font-weight:700;font-size:1.05rem}
.timeline{list-style:none;margin:0;padding:0 0 0 4px}
.timeline li{position:relative;padding:0 0 16px 24px}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline li::after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink-3)}
.timeline li.cur::after{background:var(--ink);border-color:var(--ink)}
.timeline .s{font-weight:600}
.reco{border-left:4px solid var(--ink);background:#F6F9F8;padding:12px 16px;border-radius:0 6px 6px 0}
.calc{font-variant-numeric:tabular-nums}
.calc td{padding:7px 12px}
.calc tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem}
.ok{color:var(--baixo);font-weight:600}
.warn{color:var(--alto);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.notif{display:grid;grid-template-columns:auto 1fr auto;gap:14px;padding:14px 18px;text-decoration:none;color:inherit;align-items:start}
.notif:hover{background:#F6F9F8}
.notif.unread{background:#F3F8FA}
.notif.unread .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--water);margin-right:8px;vertical-align:middle}
.notif .t{font-weight:600}
.dot-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field > label,.field > .lab{font-weight:600;font-size:.9rem}
.field input[type=text],.field input[type=email],.field input[type=password],.field textarea,.field select{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:#fff;width:100%}
.field textarea{min-height:84px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted)}
.typepick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.typepick label{border:1px solid var(--line);border-radius:6px;padding:12px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.84rem;font-weight:600;background:#fff}
.typepick input{position:absolute;opacity:0}
.typepick label:has(input:checked){border:2px solid var(--ink);padding:11px 7px;background:#F6F9F8}
.typepick label:has(input:focus-visible){outline:3px solid #2E8FB3}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:#fff}
.radios label:has(input:checked){border-color:var(--ink);background:#F6F9F8}
.steps{display:flex;gap:0;margin-bottom:20px;counter-reset:s}
.steps li{list-style:none;flex:1;font-size:.84rem;color:var(--muted);padding-top:8px;border-top:3px solid var(--line);counter-increment:s}
.steps li::before{content:counter(s) ". "}
.steps li.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.photo{border:1px dashed var(--ink-3);border-radius:6px;padding:16px;display:flex;align-items:center;gap:14px;background:#FAFCFB}
.thumb{width:72px;height:54px;border-radius:4px;background:linear-gradient(160deg,#7B8F99 0%,#A7B9BF 45%,#5E7F8C 46%,#7FA2AE 100%);flex:none}
.lgpd{display:flex;gap:10px;background:var(--water-soft);border-radius:6px;padding:12px 14px;font-size:.86rem;color:#163F50}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line-2)}
.switch:first-child{border-top:0}
.tgl{appearance:none;width:42px;height:24px;border-radius:12px;background:#C3CDCB;position:relative;cursor:pointer;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tgl:checked{background:var(--ink)}
.tgl:checked::after{left:21px}
.progress{display:flex;gap:4px;margin-top:8px}
.progress i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--ink)}
.progress i.off{background:var(--crit)}
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:.88rem}
.bar-track{height:16px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--ink-3)}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ind{padding:16px 18px;border-left:1px solid var(--line-2)}
.ind:first-child{border-left:0}

/* toasts and modal */
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:6px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:.9rem;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(20,40,60,.45);display:grid;place-items:center;z-index:40;padding:20px}
.modal{background:#fff;border-radius:8px;max-width:480px;width:100%;padding:22px 24px}
.modal h2{margin-bottom:8px}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-art{background:var(--ink);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h1{font-size:2.6rem;line-height:1.05;max-width:12ch;letter-spacing:-.025em}
.login-art p{color:#B9CAD5;max-width:42ch;margin-top:14px}
.login-art svg.bgmap{position:absolute;right:-60px;bottom:-40px;width:620px;opacity:.5}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--surface)}
.login-form form{width:100%;max-width:400px}

@media (max-width:1100px){.dash{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line-2)}}
@media (max-width:820px){
  .login-art svg.bgmap{opacity:.15}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px}
  .brand{padding:0 10px 0 0}.brand small{display:none}
  .nav{flex-direction:row}.nav a span.lbl{display:none}
  .side-foot{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}.content{padding:16px}
  .grid2,.facts{grid-template-columns:1fr}.facts>div{border-left:0;border-top:1px solid var(--line-2)}
  .typepick{grid-template-columns:repeat(3,1fr)}
  .login{grid-template-columns:1fr}.login-art{min-height:260px;padding:28px}.login-art h1{font-size:2rem}
  .who .nm{display:none}
}
</style>
</head>

function ajustesDado(d){
  const ft = FONTE_TIPO[d.fonteTipo];
  const a = [['Base: '+ft.nome, ft.base]];
  if(d.fotoGeo) a.push(['Foto e geolocalização do aparelho', 10]);

function scoreDado(d){ return Math.max(0, Math.min(100, ajustesDado(d).reduce((s,x)=>s+x[1],0))); }
// RN05: confiança do evento = média ponderada pelo peso da fonte; confirmação humana garante mínimo 80
function confEvento(ev){
  if(ev.estado==='Descartado') return 0;
  let s=0,p=0; ev.dados.forEach(d=>{const w=FONTE_TIPO[d.fonteTipo].peso; s+=scoreDado(d)*w; p+=w;});
  let c = p? Math.round(s/p) : 0;
  if(ev.confirmadoPor) c = Math.max(c, 80);
  return c;
}

  m += '<path class="river thin" d="M560 470 C530 420 500 370 470 320 C450 280 430 220 420 172"/>';
  m += '<text class="rn" x="520" y="150">Rio Tietê</text><text class="rn" x="160" y="395" transform="rotate(-58 160 395)">Rio Pinheiros</text>';
  DIST.forEach(d=>{ m+='<text x="'+d[1]+'" y="'+d[2]+'" text-anchor="middle">'+d[0]+'</text>'; });

    if(f.tipo && e.tipo!==f.tipo) return false;
    if(f.nivel && nivelRisco(riscoEvento(e))!==f.nivel) return false;

  });

  return '<section class="panel"><div class="filters">'+

    '<label class="sr" for="ft">Tipo</label><select id="ft">'+opt('','Todos os tipos',f.tipo)+Object.keys(TIPOS).map(k=>opt(k,TIPOS[k].nome,f.tipo)).join('')+'</select>'+

    '<span class="grow" style="flex:1"></span><span class="small muted">'+list.length+' evento'+(list.length!==1?'s':'')+', ordenados por prioridade</span></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>Nível de risco</th><th>Evento</th><th>Estado</th><th>Confiança</th><th>Fontes</th><th>Atualizado</th></tr></thead><tbody>'+
    (list.length? list.map(e=>{ const tipos=[...new Set(e.dados.map(d=>d.fonteTipo))];

R.alertas.after = function(){

};

// T04 Detalhe
R.alerta = function(id){
  const e = ev(id); if(!e) return '<p>Evento não encontrado. <a href="#/alertas">Voltar para alertas</a></p>';
  const R_ = riscoEvento(e), k=nivelRisco(R_), c=confEvento(e);
  const gestor = S.role==='agente' || S.role==='operador';
  let acoes='';
  if(gestor && e.estado==='Em validação') acoes='<a class="btn" href="#/validacao">Validar na fila</a>';
  else if(gestor && e.estado==='Em monitoramento') acoes='<button class="btn" data-act="encerrar">Encerrar evento</button><button class="btn ghost" data-act="reemitir">Reemitir alerta</button>';
  else if(S.role==='morador' && ativo(e)) acoes='<button class="btn" data-act="confirmar">Também estou vendo isso</button><button class="btn ghost" data-act="seguir">'+(e.seguindo?'Deixar de seguir':'Seguir evento')+'</button>';
  return '<p style="margin-bottom:14px"><a href="#/alertas" class="row small" style="gap:4px;text-decoration:none">'+I.back+'Voltar para alertas</a></p>'+
  '<div class="stack"><section class="panel"><div class="hero">'+typeIcon(e.tipo,k,52)+'<div style="flex:1"><div class="row" style="gap:8px;margin-bottom:6px">'+lvlBadge(k)+stateBadge(e)+'<span class="small muted">'+e.id+'</span></div><h1>'+esc(e.titulo)+'</h1><p class="muted">'+esc(TIPOS[e.tipo].nome)+' em '+esc(e.bairro)+', iniciado às '+hhmm(e.criado)+'</p></div><div class="row">'+acoes+'</div></div>'+
  '<div class="facts"><div><div class="l">Risco (severidade × exposição)</div><div class="v">'+e.S+' × '+e.E+' = '+R_+' ('+NIVEIS[k].nome+')</div><div class="small muted">'+esc(e.sevTxt)+'. '+esc(e.expTxt)+'.</div></div>'+
  '<div><div class="l">Confiança do evento</div><div class="v">'+confBadge(c)+'</div><div class="small"><a href="#/origem/'+e.id+'">Ver origem e confiança dos dados</a></div></div>'+
  '<div><div class="l">Pessoas na área de alerta</div><div class="v">'+(e.afetados?fmtN(e.afetados):'Não informado')+'</div><div class="small muted">'+(e.alerta?'Alerta enviado':'Sem alerta enviado')+'</div></div></div></section>'+
  '<div class="grid2"><section class="panel"><div class="panel-h"><h2>O que fazer</h2></div><div class="panel-b"><p class="reco">'+esc(e.reco)+'</p>'+
  '<h3 style="margin:18px 0 10px">Dados que compõem este evento</h3><ul class="list" style="border:1px solid var(--line-2);border-radius:6px">'+
  e.dados.map(d=>'<li><a class="item" href="#/origem/'+e.id+'?d='+d.id+'" style="grid-template-columns:1fr auto"><span><span class="t small">'+esc(d.medida)+'</span><br><span class="meta">'+srcBadge(d.fonteTipo)+' '+esc(d.fonte)+', '+rel(Date.now()-d.idadeMin*MIN)+'</span></span>'+confBadge(scoreDado(d))+'</a></li>').join('')+'</ul></div></section>'+
  '<section class="panel"><div class="panel-h"><h2>Ciclo de vida do evento</h2></div><div class="panel-b"><ol class="timeline">'+
  e.hist.map((h,i)=>'<li class="'+(i===e.hist.length-1?'cur':'')+'"><span class="s">'+esc(h[0])+'</span> <span class="small muted">'+hhmm(h[1])+'</span><br><span class="small muted">'+esc(h[2])+'</span></li>').join('')+'</ol></div></section></div></div>';
};
R.alerta.after = function(id){
  const e=ev(id); if(!e) return;
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='encerrar'){ modal('<h2>Encerrar evento '+e.id+'?</h2><p class="small muted" style="margin:8px 0 14px">Os moradores que receberam o alerta serão avisados de que a situação foi normalizada.</p><div class="field"><label for="mt">Motivo</label><select id="mt"><option>Indicadores abaixo do limiar por 30 min</option><option>Serviço restabelecido</option><option>Vistoria em campo concluída</option></select></div><div class="row"><button class="btn" id="okc">Encerrar evento</button><button class="btn ghost" onclick="UG.closeModal()">Cancelar</button></div>');
      $('#okc').onclick=()=>{ const m=$('#mt').value; e.hist.push(['Encerrado',Date.now(),USERS[S.role].nome+': '+m]); e.estado='Encerrado'; S.notifs.push({id:'N'+Date.now(),para:['morador','agente','operador'],ev:e.id,titulo:'Evento encerrado: '+TIPOS[e.tipo].nome+' em '+e.bairro,texto:m+'.',hora:Date.now(),canal:'Push',lida:false}); save(); closeModal(); toast('Evento encerrado. Moradores avisados.'); render(); };
    }
    if(a==='reemitir'){ e.hist.push(['Alerta emitido',Date.now(),'Reemitido por '+USERS[S.role].nome]); e.hist.push(['Em monitoramento',Date.now(),'Notificações reenviadas']); save(); toast('Alerta reemitido para a área do evento.'); render(); }
    if(a==='confirmar'){ e.dados.push({id:'D-'+Math.floor(90000+Math.random()*9000), fonte:'RC-'+Math.floor(4830+Math.random()*100), fonteNome:'Registro de morador', fonteTipo:'comunidade', medida:'Morador confirmou que vê a situação', idadeMin:0, corrob:2}); save(); toast('Obrigado. Sua confirmação foi adicionada ao evento.'); render(); }
    if(a==='seguir'){ e.seguindo=!e.seguindo; save(); toast(e.seguindo?'Você vai receber cada atualização deste evento.':'Você deixou de seguir este evento.'); render(); }
  });
};

// T05 Origem e confiança
R.origem = function(id, q){
  const e = ev(id); if(!e) return '<p>Evento não encontrado.</p>';
  const sel = (q && q.d) ? e.dados.find(d=>d.id===q.d) : e.dados[0];
  const d = sel || e.dados[0];
  const aj = ajustesDado(d), sc = scoreDado(d);
  let num=0, den=0; e.dados.forEach(x=>{ const w=FONTE_TIPO[x.fonteTipo].peso; num+=scoreDado(x)*w; den+=w; });
  const ft = FONTE_TIPO[d.fonteTipo];
  const atrasado = d.idadeMin > ft.limiteMin;
  return '<p style="margin-bottom:14px"><a href="#/alerta/'+e.id+'" class="row small" style="gap:4px;text-decoration:none">'+I.back+'Voltar para '+e.id+'</a></p>'+
  '<div class="stack"><section class="panel"><div class="panel-h"><div class="grow"><h2>Origem e confiança dos dados</h2><p class="small muted">'+esc(e.titulo)+', '+esc(e.bairro)+'</p></div>'+confBadge(confEvento(e))+'</div>'+
  '<div style="overflow-x:auto"><table><thead><tr><th>Dado</th><th>Origem</th><th>Coletado</th><th>Validações</th><th>Confiança</th></tr></thead><tbody>'+
  e.dados.map(x=>'<tr class="click" data-go="#/origem/'+e.id+'?d='+x.id+'" tabindex="0" '+(x.id===d.id?'style="outline:2px solid var(--ink);outline-offset:-2px"':'')+'><td><b class="small">'+esc(x.medida)+'</b><br><span class="small muted">'+x.id+'</span></td><td>'+srcBadge(x.fonteTipo)+'<br><span class="small muted">'+esc(x.fonteNome)+' ('+esc(x.fonte)+')</span></td><td class="small">'+hhmm(Date.now()-x.idadeMin*MIN)+'<br><span class="muted">'+rel(Date.now()-x.idadeMin*MIN)+'</span></td><td class="small"><span class="ok">Formato</span>, <span class="ok">faixa</span>, <span class="ok">duplicidade</span></td><td>'+confBadge(scoreDado(x))+'</td></tr>').join('')+
  '</tbody></table></div></section>'+
  '<div class="grid2"><section class="panel"><div class="panel-h"><h2 class="grow">Como a confiança de '+d.id+' foi calculada</h2></div><div class="panel-b">'+
  '<p class="small" style="margin-bottom:12px">'+srcBadge(d.fonteTipo)+' '+esc(d.fonteNome)+'. '+(atrasado?'<span class="warn">Dado desatualizado: passou do limite de '+ft.limiteMin+' min.</span>':'<span class="ok">Dentro do limite de atualização ('+ft.limiteMin+' min).</span>')+'</p>'+
  '<table class="calc"><tbody>'+aj.map(a=>'<tr><td>'+esc(a[0])+'</td><td style="text-align:right">'+(a[1]>0&&a!==aj[0]?'+':'')+a[1]+'</td></tr>').join('')+
  '<tr class="tot"><td>Confiança do dado (limitada entre 0 e 100)</td><td style="text-align:right">'+sc+' ('+CLASSE_NOME[classeConf(sc)]+')</td></tr></tbody></table>'+
  '<p class="small muted" style="margin-top:10px">Regras RN01 a RN03. Alta: 75 a 100. Média: 50 a 74. Baixa: abaixo de 50.</p></div></section>'+
  '<section class="panel"><div class="panel-h"><h2>Confiança do evento</h2></div><div class="panel-b">'+
  '<p class="small" style="margin-bottom:10px">Média ponderada pelo peso de cada tipo de fonte: sensor 4, base pública 4, registro comunitário 1 (RN05).</p>'+
  '<p class="calc" style="font-size:1.05rem;font-weight:600;margin-bottom:6px">('+e.dados.map(x=>scoreDado(x)+'×'+FONTE_TIPO[x.fonteTipo].peso).join(' + ')+') ÷ '+den+' = '+Math.round(num/den)+'</p>'+
  (e.confirmadoPor?'<p class="small">Confirmado por '+esc(e.confirmadoPor)+'. Com confirmação humana, a confiança mínima do evento é 80.</p>':'')+
  '<div class="lgpd" style="margin-top:16px">'+I.lock+'<span>Quem registrou a ocorrência não é identificado. A localização de registros comunitários aparece com precisão de cerca de 100 m (LGPD, minimização de dados).</span></div></div></section></div></div>';
};
R.origem.after = function(){ document.querySelectorAll('tr[data-go]').forEach(tr=>{ tr.onclick=()=>location.hash=tr.dataset.go; tr.onkeydown=(e)=>{ if(e.key==='Enter') location.hash=tr.dataset.go; }; }); };

// T06 Notificações

  '<div class="tabs" role="tablist">'+t('todas','Todas')+t('nao','Não lidas',naoLidas())+t('criticas','Críticas')+'</div>'+
  '<ul class="list">'+(list.length? list.map(n=>{ const e=ev(n.ev); const k=e?nivelRisco(riscoEvento(e)):'baixo';
    return '<li><a class="notif'+(n.lida?'':' unread')+'" href="#/alerta/'+n.ev+'" data-n="'+n.id+'">'+(e?typeIcon(e.tipo,k):'')+'<span><span class="t">'+esc(n.titulo)+'</span><br><span class="small">'+esc(n.texto)+'</span><br><span class="small muted">'+esc(n.canal)+(e?', confiança '+CLASSE_NOME[classeConf(confEvento(e))].toLowerCase():'')+'</span></span><span class="small muted">'+hhmm(n.hora)+'</span></a></li>'; }).join('')
   : '<li style="padding:28px;text-align:center" class="muted">Nenhuma notificação aqui. Quando houver alerta nas suas áreas, ele aparece nesta lista.</li>')+'</ul></section>';

R.notificacoes.after = function(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ R.notificacoes.tab=b.dataset.tab; render(); });
  document.querySelectorAll('[data-n]').forEach(a=>a.addEventListener('click',()=>{ const n=S.notifs.find(x=>x.id===a.dataset.n); if(n){ n.lida=true; save(); } }));
  $('#mall').onclick=()=>{ notifsDoPerfil().forEach(n=>n.lida=true); save(); toast('Todas as notificações foram marcadas como lidas.'); render(); };
};

// T07 Registrar ocorrência
const SEV_ALAG = [['Poças na rua (menos de 15 cm)',2],['Água cobrindo a calçada (15 a 30 cm)',3],['Na altura do joelho (30 a 50 cm)',4],['Acima do joelho (mais de 50 cm)',5]];
const SEV_GEN = [['Pouco impacto',2],['Afeta minha rua',3],['Afeta o bairro todo',4]];
R.registrar = function(){
  const f = R.registrar.f || (R.registrar.f={tipo:'alagamento', sev:2, end:'Rua Ibitirama, 1200, Vila Prudente', desc:'', foto:false, loc:true});
  const sevs = f.tipo==='alagamento'?SEV_ALAG:SEV_GEN;
  if(f.sev>=sevs.length) f.sev=sevs.length-1;
  return '<div class="grid2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)"><section class="panel"><div class="panel-h"><div><h2>Registrar ocorrência</h2><p class="small muted">Leva menos de 1 minuto. A Defesa Civil valida antes de virar alerta.</p></div></div><div class="panel-b"><form id="f-reg" novalidate>'+
  '<ol class="steps" style="padding:0;margin:0 0 20px"><li class="on">O que está acontecendo</li><li class="'+(f.tipo?'on':'')+'">Onde e quanto</li><li class="'+(f.desc||f.foto?'on':'')+'">Detalhes e envio</li></ol>'+
  '<div class="field"><span class="lab" id="lt">Tipo de ocorrência</span><div class="typepick" role="radiogroup" aria-labelledby="lt">'+
  Object.keys(TIPOS).map(k=>'<label><input type="radio" name="tipo" value="'+k+'" '+(f.tipo===k?'checked':'')+'><span style="color:var(--ink)">'+I[k]+'</span>'+TIPOS[k].nome+'</label>').join('')+'</div></div>'+
  '<div class="field"><label for="end">Local</label><input id="end" type="text" value="'+esc(f.end)+'"><label class="row small" style="gap:8px"><input type="checkbox" id="loc" '+(f.loc?'checked':'')+'> Usar a localização do meu aparelho agora</label></div>'+
  '<div class="field"><span class="lab" id="ls">'+(f.tipo==='alagamento'?'Altura da água':'Tamanho do problema')+'</span><div class="radios" role="radiogroup" aria-labelledby="ls">'+
  sevs.map((s,i)=>'<label><input type="radio" name="sev" value="'+i+'" '+(f.sev===i?'checked':'')+'> '+s[0]+'</label>').join('')+'</div></div>'+
  '<div class="field"><label for="desc">Descrição (opcional)</label><textarea id="desc" placeholder="Ex.: a água está entrando nas casas da esquina">'+esc(f.desc)+'</textarea></div>'+
  '<div class="field"><span class="lab">Foto (opcional, aumenta a confiança)</span><div class="photo">'+(f.foto?'<span class="thumb" role="img" aria-label="Foto anexada"></span><span class="small"><b>foto_ocorrencia.jpg</b><br>Metadados de localização removidos antes do envio.</span><button type="button" class="btn ghost sm" id="rmf" style="margin-left:auto">Remover</button>':'<button type="button" class="btn ghost" id="addf">Adicionar foto</button><span class="small muted">Rostos e placas são borrados automaticamente.</span>')+'</div></div>'+
  '<div class="lgpd" style="margin-bottom:18px">'+I.lock+'<span>Seu nome não aparece para outras pessoas. No mapa público o local fica com precisão de cerca de 100 m.</span></div>'+
  '<button class="btn" id="send" type="submit" style="padding:12px 22px">Enviar ocorrência</button></form></div></section>'+
  '<aside class="panel" style="align-self:start"><div class="panel-h"><h2>O que acontece depois</h2></div><div class="panel-b"><ol class="timeline">'+
  '<li class="cur"><span class="s">Reportado</span><br><span class="small muted">Você recebe um número de protocolo.</span></li>'+
  '<li><span class="s">Em validação</span><br><span class="small muted">O sistema cruza com sensores e bases públicas e calcula a confiança.</span></li>'+
  '<li><span class="s">Confirmado</span><br><span class="small muted">Por confiança alta ou por um agente da Defesa Civil.</span></li>'+
  '<li><span class="s">Alerta emitido</span><br><span class="small muted">Quem acompanha a área recebe a notificação.</span></li></ol></div></aside></div>';
};
R.registrar.after = function(){
  const f=R.registrar.f;
  const sync=()=>{ f.end=$('#end').value; f.desc=$('#desc').value; f.loc=$('#loc').checked; };
  document.querySelectorAll('input[name=tipo]').forEach(r=>r.onchange=()=>{ sync(); f.tipo=r.value; f.sev=0; render(); });
  document.querySelectorAll('input[name=sev]').forEach(r=>r.onchange=()=>{ f.sev=+r.value; });
  const af=$('#addf'); if(af) af.onclick=()=>{ sync(); f.foto=true; render(); };
  const rf=$('#rmf'); if(rf) rf.onclick=()=>{ sync(); f.foto=false; render(); };
  $('#f-reg').onsubmit=(e)=>{
    e.preventDefault(); sync();
    if(!f.end.trim()){ toast('Informe o local da ocorrência para enviar.'); $('#end').focus(); return; }
    const sevs=f.tipo==='alagamento'?SEV_ALAG:SEV_GEN; const Sv=sevs[f.sev][1];
    const id='EV-'+(1047+S.minhas.length-1);
    const prot='UG-2026-00'+(4821+S.minhas.length-1);
    const bairro = (f.end.split(',').pop()||'Vila Prudente').trim() || 'Vila Prudente';
    const now=Date.now();
    const d={id:'D-88'+(140+S.minhas.length), fonte:'RC-'+(4821+S.minhas.length-1), fonteNome:'Registro de morador', fonteTipo:'comunidade', medida:(f.desc.trim()||sevs[f.sev][0]), idadeMin:0, fotoGeo:f.foto&&f.loc, corrob: f.tipo==='alagamento'?1:0};
    const nev={id, tipo:f.tipo, titulo:TIPOS[f.tipo].nome+' na '+f.end.split(',')[0], bairro, x:612, y:362, S:Sv, E:3,
      sevTxt:sevs[f.sev][0], expTxt:'Área residencial com escola estadual', afetados:1180, estado:'Em validação', alerta:false, confirmadoPor:null, criado:now,
      reco:'Aguardando validação da Defesa Civil.', hist:[['Reportado',now,'Registro de morador, protocolo '+prot]], dados:[d], novo:true};
    const c=confEvento(nev);
    nev.hist.push(['Em validação',now,'Confiança '+CLASSE_NOME[classeConf(c)]+' ('+c+')'+(f.tipo==='alagamento'?', pluviômetro a 800 m marca 32 mm/h':'')]);
    S.eventos.push(nev);
    S.minhas.unshift({prot, ev:id, criado:now, tipo:f.tipo, local:f.end});
    S.notifs.push({id:'N'+now, para:['agente'], ev:id, titulo:'Nova ocorrência para validar em '+bairro, texto:TIPOS[f.tipo].nome+' com confiança '+CLASSE_NOME[classeConf(c)]+'.', hora:now, canal:'Painel', lida:false});
    save(); R.registrar.f=null;
    modal('<h2>Ocorrência enviada</h2><p style="margin:8px 0">Protocolo <b>'+prot+'</b></p><p class="small muted" style="margin-bottom:14px">Estado atual: Em validação. Confiança inicial '+CLASSE_NOME[classeConf(c)]+' ('+c+'). Você será avisado quando a Defesa Civil analisar.</p><div class="row"><button class="btn" id="gom">Acompanhar ocorrência</button><button class="btn ghost" onclick="UG.closeModal()">Fechar</button></div>');
    $('#gom').onclick=()=>{ closeModal(); location.hash='#/minhas'; };
  };
};

// T08 Minhas ocorrências
const ETAPAS = ['Reportado','Em validação','Confirmado','Alerta emitido','Em monitoramento','Encerrado'];
R.minhas = function(){
  return '<section class="panel"><div class="panel-h"><div class="grow"><h2>Minhas ocorrências</h2><p class="small muted">Acompanhe o que você registrou. O estado muda conforme a validação.</p></div><a class="btn sm" href="#/registrar">Registrar ocorrência</a></div><ul class="list">'+
  S.minhas.map(m=>{ const e=ev(m.ev); const c=confEvento(e); const idx=ETAPAS.indexOf(e.estado); const desc=e.estado==='Descartado';
    return '<li style="padding:16px 18px"><div class="row" style="justify-content:space-between"><div class="row">'+typeIcon(e.tipo,nivelRisco(riscoEvento(e)))+'<div><b>'+esc(TIPOS[m.tipo].nome)+'</b><span class="muted small"> '+m.prot+'</span><br><span class="small muted">'+esc(m.local)+', enviada '+rel(m.criado)+'</span></div></div><div class="row">'+stateBadge(e)+confBadge(c)+'<a class="btn ghost sm" href="#/alerta/'+e.id+'">Ver evento</a></div></div>'+
    '<div class="progress" aria-label="Progresso: '+esc(e.estado)+'">'+ETAPAS.map((s,i)=>'<i class="'+(desc? (i<2?'on':'off') : (i<=idx?'on':''))+'" title="'+s+'"></i>').join('')+'</div>'+
    '<div class="row small muted" style="justify-content:space-between;margin-top:4px"><span>Reportado</span><span>'+(desc?'Descartado: '+esc(e.hist[e.hist.length-1][2]):'Encerrado')+'</span></div></li>'; }).join('')+'</ul></section>';
};

// T09 Fila de validação
R.validacao = function(){
  const fila = filaValidacao();
  return '<section class="panel"><div class="panel-h"><div class="grow"><h2>Fila de validação</h2><p class="small muted">'+(S.role==='operador'?'Ocorrências de serviços (energia, água e transporte). ':'')+'Eventos com confiança Média ou Baixa aguardam análise humana antes de virar alerta (RN07).</p></div><span class="small muted">'+fila.length+' pendente'+(fila.length!==1?'s':'')+'</span></div><ul class="list">'+
  (fila.length? fila.map(e=>{ const c=confEvento(e), k=nivelRisco(riscoEvento(e));
    return '<li style="padding:16px 18px'+(e.novo?';background:#F3F8FA':'')+'"><div style="display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start">'+typeIcon(e.tipo,k,44)+
    '<div><div class="row" style="gap:8px">'+lvlBadge(k)+confBadge(c)+'<span class="small muted">'+e.id+', '+rel(e.criado)+'</span>'+(e.novo?'<span class="state ativo">Novo</span>':'')+'</div><h3 style="margin:6px 0 2px">'+esc(e.titulo)+', '+esc(e.bairro)+'</h3>'+
    '<p class="small">'+esc(e.sevTxt)+'. Risco '+e.S+' × '+e.E+' = '+riscoEvento(e)+'.</p><p class="small muted">Por que está aqui: '+e.dados.length+' dado'+(e.dados.length>1?'s':'')+', só de registros comunitários'+(e.dados.some(d=>d.corrob)?', com corroboração indireta':', sem corroboração')+'. <a href="#/origem/'+e.id+'">Ver origem e confiança</a></p></div>'+
    '<div class="row" style="flex-direction:column;align-items:stretch;gap:6px"><button class="btn" data-ok="'+e.id+'">Confirmar evento</button><button class="btn danger" data-no="'+e.id+'">Descartar</button></div></div></li>'; }).join('')
   : '<li style="padding:32px;text-align:center" class="muted">Nenhuma ocorrência aguardando validação. Novos registros aparecem aqui automaticamente.</li>')+'</ul></section>';
};
R.validacao.after = function(){
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{
    const e=ev(b.dataset.ok); const now=Date.now(); const nome=USERS[S.role].nome;
    e.confirmadoPor = nome+(S.role==='agente'?' (Defesa Civil)':' (operadora)');
    e.estado='Confirmado'; e.hist.push(['Confirmado',now,'Confirmado por '+e.confirmadoPor]);
    const k=nivelRisco(riscoEvento(e));
    if(k!=='baixo'){ // RN06/RN07: risco Moderado ou maior gera alerta
      e.estado='Alerta emitido'; e.alerta=true; e.hist.push(['Alerta emitido',now,'Risco '+NIVEIS[k].nome]);
      e.reco = e.tipo==='alagamento' ? 'Evite a '+e.titulo.replace(/^.* na /,'')+' e ruas próximas. Não atravesse áreas com água. Se precisar de ajuda, ligue 199.' : 'Siga as orientações da Defesa Civil e acompanhe as atualizações.';
      S.notifs.push({id:'N'+now, para:['morador','agente','operador'], ev:e.id, titulo:'Alerta '+NIVEIS[k].nome.toLowerCase()+': '+TIPOS[e.tipo].nome.toLowerCase()+' em '+e.bairro, texto:e.sevTxt+'. Confirmado pela Defesa Civil.', hora:now, canal:'Push', lida:false});
      save(); toast('Evento confirmado. Alerta '+NIVEIS[k].nome.toLowerCase()+' enviado para '+fmtN(e.afetados)+' pessoas na área.');
      setTimeout(()=>{ e.estado='Em monitoramento'; e.hist.push(['Em monitoramento',Date.now(),'Notificações entregues a '+fmtN(e.afetados)+' pessoas']); save(); if(location.hash.includes(e.id)) render(); }, 3000);
    } else { e.estado='Em monitoramento'; e.hist.push(['Em monitoramento',now,'Risco Baixo, sem alerta (RN06)']); save(); toast('Evento confirmado. Risco Baixo: fica no mapa sem envio de alerta.'); }
    e.novo=false; render();
  });
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{
    const e=ev(b.dataset.no);
    modal('<h2>Descartar '+e.id+'?</h2><p class="small muted" style="margin:8px 0 14px">O relator será avisado. O motivo fica registrado para auditoria.</p><div class="field"><label for="mo">Motivo</label><select id="mo"><option>Sem corroboração após vistoria</option><option>Foto não corresponde ao local</option><option>Registro duplicado</option><option>Situação já normalizada</option></select></div><div class="row"><button class="btn danger" id="okd">Descartar ocorrência</button><button class="btn ghost" onclick="UG.closeModal()">Cancelar</button></div>');
    $('#okd').onclick=()=>{ const m=$('#mo').value; e.estado='Descartado'; e.novo=false; e.hist.push(['Descartado',Date.now(),USERS[S.role].nome+': '+m]); save(); closeModal(); toast('Ocorrência descartada. Motivo registrado.'); render(); };
  });
};

// T10 Análises
const FONTES = [
  ['SN-PNT-04','Sensor de nível do córrego','sensor','há 40 s','99,8%','Online'],
  ['SN-CTR-11','Sensor de temperatura e umidade','sensor','há 1 min','99,6%','Online'],
  ['SN-VPR-07','Pluviômetro Vila Prudente','sensor','há 35 s','99,9%','Online'],
  ['SN-BUT-02','Sensor de nível Butantã','sensor','há 22 min','97,1%','Atrasada'],
  ['SN-SAM-05','Pluviômetro Santo Amaro','sensor','há 3 h','91,4%','Offline'],
  ['BP-MET-01','Boletim meteorológico municipal','publica','há 4 min','99,5%','Online'],
  ['BP-ENE-02','API da concessionária de energia','publica','há 4 min','99,2%','Online'],
  ['BP-TRA-01','API de transporte público','publica','há 2 min','98,9%','Online'],
  ['APP','Registros comunitários (aplicativo)','comunidade','há 1 min','99,9%','Online']
];
R.analises = function(){
  const tipos = {alagamento:42, calor:27, energia:19, agua:11, transporte:23};
  const mx = Math.max(...Object.values(tipos));
  return '<div class="stack"><section class="panel"><div class="panel-h"><div class="grow"><h2>Indicadores de sucesso</h2><p class="small muted">Últimos 30 dias. Valores simulados para o protótipo.</p></div></div>'+
  '<div style="display:grid;grid-template-columns:repeat(3,1fr)">'+
  '<div class="ind"><div class="l small muted">Tempo de atualização dos dados</div><div class="big">41 s</div><p class="small">p95 dos sensores (meta: até 60 s, RNF01). Bases públicas: 4 min 12 s (meta: 5 min).</p></div>'+
  '<div class="ind"><div class="l small muted">Qualidade dos alertas</div><div class="big">91%</div><p class="small">dos alertas enviados foram confirmados em campo. 6 alertas falsos em 70.</p></div>'+
  '<div class="ind"><div class="l small muted">Facilidade de uso</div><div class="big">48 s</div><p class="small">tempo médio para registrar uma ocorrência (meta: até 60 s, RNF05).</p></div></div></section>'+
  '<div class="grid2"><section class="panel"><div class="panel-h"><h2>Eventos por tipo</h2></div><div class="panel-b bar-chart">'+
  Object.keys(tipos).map(k=>'<div class="bar-row"><span>'+TIPOS[k].nome+'</span><span class="bar-track"><span class="bar-fill" style="display:block;width:'+(tipos[k]/mx*100)+'%"></span></span><b>'+tipos[k]+'</b></div>').join('')+
  '</div></section><section class="panel"><div class="panel-h"><h2>Origem dos dados recebidos</h2></div><div class="panel-b bar-chart">'+
  [['Sensores IoT',68],['Bases públicas',21],['Registros comunitários',11]].map(r=>'<div class="bar-row"><span>'+r[0]+'</span><span class="bar-track"><span class="bar-fill" style="display:block;width:'+r[1]+'%;background:var(--water)"></span></span><b>'+r[1]+'%</b></div>').join('')+
  '<p class="small muted">Registros comunitários são poucos em volume, mas originaram 34% dos eventos confirmados.</p></div></section></div>'+
  '<section class="panel"><div class="panel-h"><div class="grow"><h2>Status das fontes de dados</h2><p class="small muted">Fonte sem atualização além do limite fica marcada como desatualizada e perde confiança (RN02, RNF03).</p></div></div><div style="overflow-x:auto"><table><thead><tr><th>Fonte</th><th>Tipo</th><th>Última atualização</th><th>Disponibilidade (30 dias)</th><th>Status</th></tr></thead><tbody>'+
  FONTES.map(f=>'<tr><td><b>'+f[0]+'</b><br><span class="small muted">'+f[1]+'</span></td><td>'+srcBadge(f[2])+'</td><td>'+f[3]+'</td><td>'+f[4]+'</td><td>'+(f[5]==='Online'?'<span class="ok">Online</span>':f[5]==='Atrasada'?'<span class="warn">Atrasada, dados desatualizados</span>':'<span style="color:var(--crit);font-weight:600">Offline</span>')+'</td></tr>').join('')+
  '</tbody></table></div></section></div>';
};

// T11 Privacidade e preferências
R.privacidade = function(){
  const p=S.prefs;
  const sw=(id,l,d,on)=>'<div class="switch"><label for="'+id+'"><b class="small">'+l+'</b><br><span class="small muted">'+d+'</span></label><input class="tgl" type="checkbox" id="'+id+'" '+(on?'checked':'')+'></div>';
  return '<div class="grid2"><div class="stack"><section class="panel"><div class="panel-h"><h2>Áreas e tipos de alerta</h2></div><div class="panel-b">'+
  '<div class="field"><span class="lab">Bairros que você acompanha</span><div class="chips">'+p.areas.map(a=>'<span class="chip" aria-pressed="true">'+esc(a)+'</span>').join('')+'<button class="chip" id="addA">Adicionar bairro</button></div></div>'+
  '<div class="field"><label for="raio">Raio ao redor de cada bairro: <b id="rv">'+p.raio+' km</b></label><input id="raio" type="range" min="1" max="5" value="'+p.raio+'"></div>'+
  Object.keys(TIPOS).map(k=>sw('t-'+k, TIPOS[k].nome, k==='transporte'?'Desvios e interrupções de linhas':'Receber alertas deste tipo', p.tipos[k])).join('')+
  '</div></section><section class="panel"><div class="panel-h"><h2>Como avisar</h2></div><div class="panel-b">'+
  sw('push','Notificação no celular','Todos os níveis',p.push)+sw('sms','SMS','Somente alertas críticos',p.sms)+sw('email','E-mail','Resumo diário',p.email)+
  sw('silencio','Horário silencioso (22h às 7h)','Alertas críticos tocam mesmo assim',p.silencio)+'</div></section></div>'+
  '<div class="stack"><section class="panel"><div class="panel-h"><h2>Seus dados (LGPD)</h2></div><div class="panel-b">'+
  sw('locTR','Localização em tempo real','Opcional. Sem ela, usamos só os bairros escolhidos.',p.locTempoReal)+sw('fotos','Enviar fotos nos registros','Metadados removidos e rostos borrados',p.fotos)+
  '<div class="switch"><span><b class="small">Dados que guardamos</b><br><span class="small muted">Nome, e-mail, telefone, bairros acompanhados e seus registros. Registros sem identificação são mantidos por 12 meses para análise.</span></span></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn ghost" id="dl">Baixar meus dados</button><button class="btn danger" id="del">Excluir minha conta</button></div></div></section>'+
  '<section class="panel"><div class="panel-h"><h2>Consentimento</h2></div><div class="panel-b"><p class="small">Aceito em '+new Date().toLocaleDateString('pt-BR')+'. Base legal: consentimento (art. 7º, I) e proteção da vida (art. 7º, VII). Você pode revogar quando quiser, mas deixará de receber alertas.</p><div class="row" style="margin-top:12px"><button class="btn ghost sm" id="rev">Revogar consentimento</button></div></div></section>'+
  '<section class="panel"><div class="panel-b"><p class="small muted" style="margin-bottom:10px">Demonstração: restaura os dados de exemplo para gravar o fluxo de novo.</p><button class="btn ghost sm" id="reset">Restaurar dados de exemplo</button></div></section></div></div>';
};
R.privacidade.after = function(){
  const p=S.prefs;
  $('#raio').oninput=e=>{ p.raio=+e.target.value; $('#rv').textContent=p.raio+' km'; save(); };
  Object.keys(TIPOS).forEach(k=>$('#t-'+k).onchange=e=>{ p.tipos[k]=e.target.checked; save(); toast('Preferência salva.'); });
  [['push','push'],['sms','sms'],['email','email'],['silencio','silencio'],['locTR','locTempoReal'],['fotos','fotos']].forEach(([id,key])=>$('#'+id).onchange=e=>{ p[key]=e.target.checked; save(); toast('Preferência salva.'); });
  $('#addA').onclick=()=>{ if(!p.areas.includes('Santana')){ p.areas.push('Santana'); save(); toast('Santana adicionado às suas áreas.'); render(); } };
  $('#dl').onclick=()=>{ const blob=new Blob([JSON.stringify({titular:USERS[S.role], preferencias:p, ocorrencias:S.minhas},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='meus-dados-urbanguard.json'; a.click(); toast('Arquivo com seus dados gerado (LGPD, art. 18).'); };
  $('#del').onclick=()=>modal('<h2>Excluir sua conta?</h2><p class="small muted" style="margin:8px 0 14px">Seus dados pessoais serão apagados em até 15 dias. Registros que você fez ficam anônimos, sem nenhum vínculo com você.</p><div class="row"><button class="btn danger" id="okx">Excluir minha conta</button><button class="btn ghost" onclick="UG.closeModal()">Cancelar</button></div>');
  document.addEventListener('click', function h(ev2){ if(ev2.target && ev2.target.id==='okx'){ closeModal(); toast('Pedido de exclusão registrado. Protocolo LGPD-2026-0193.'); document.removeEventListener('click',h); } });
  $('#rev').onclick=()=>modal('<h2>Revogar consentimento?</h2><p class="small muted" style="margin:8px 0 14px">Você sai da plataforma e deixa de receber alertas.</p><div class="row"><button class="btn danger" id="okr">Revogar e sair</button><button class="btn ghost" onclick="UG.closeModal()">Cancelar</button></div>');
  document.addEventListener('click', function h2(ev2){ if(ev2.target && ev2.target.id==='okr'){ S.consent=false; S.role=null; save(); closeModal(); document.removeEventListener('click',h2); location.hash='#/entrar'; } });
  $('#reset').onclick=()=>{ const role=S.role; S=seed(); S.role=role; S.consent=true; save(); R.registrar.f=null; toast('Dados de exemplo restaurados.'); render(); };
};

/* ---------- Shell e roteamento ---------- */
const TITLES = {painel:'Painel de acompanhamento', alertas:'Alertas', alerta:'Detalhe do alerta', origem:'Origem e confiança do dado', notificacoes:'Notificações', registrar:'Registrar ocorrência', minhas:'Minhas ocorrências', validacao:'Fila de validação', analises:'Análises', privacidade:'Privacidade e alertas'};
const TAGS = {alerta:'T04 Detalhe do alerta', origem:'T05 Origem e nível de confiança do dado'};
function shell(route, inner){
  const u=USERS[S.role]; const nl=naoLidas(); const fl=filaValidacao().length;
  const secs=Math.round((Date.now()-S.lastSync)/1000);
  const navR = route==='alerta'||route==='origem' ? 'alertas' : route;
  const tag = TAGS[route] || (NAV.find(n=>n.r===route)||{}).tag || '';
  return '<div class="shell"><aside class="side"><a class="brand" href="#/painel">'+I.shield+'<span><b>UrbanGuard</b><small>Inteligência de riscos urbanos</small></span></a>'+
  '<nav class="nav" aria-label="Principal">'+NAV.filter(n=>n.roles.includes(S.role)).map(n=>'<a href="#/'+n.r+'" '+(navR===n.r?'aria-current="page"':'')+'>'+I[n.ic]+'<span class="lbl">'+n.l+'</span>'+(n.r==='notificacoes'&&nl?'<span class="count">'+nl+'</span>':'')+(n.r==='validacao'&&fl?'<span class="count">'+fl+'</span>':'')+'</a>').join('')+'</nav>'+
  '<div class="side-foot">Protótipo acadêmico. Dados simulados.<br>FIAP, GS 2026.2</div></aside>'+
  '<div class="main"><header class="top"><h1>'+TITLES[route]+'</h1><span class="grow"></span>'+
  '<span class="fresh" id="fresh"><i></i><span>Dados atualizados há <b id="secs">'+secs+'</b> s</span></span>'+
  '<a class="bell" href="#/notificacoes" aria-label="Notificações, '+nl+' não lidas">'+I.notif+(nl?'<span>'+nl+'</span>':'')+'</a>'+
  '<div class="who"><span class="avatar">'+u.ini+'</span><span class="nm"><b>'+u.nome+'</b><br><span class="muted small">'+u.papel+'</span></span>'+
  '<label class="sr" for="role">Ver como</label><select id="role" title="Trocar perfil">'+Object.keys(USERS).map(k=>'<option value="'+k+'" '+(S.role===k?'selected':'')+'>'+(k==='morador'?'Morador':k==='agente'?'Agente':'Operador')+'</option>').join('')+'<option value="sair">Sair</option></select></div></header>'+
  '<main class="content" id="content">'+inner+'</main><p class="screen-tag">'+tag+'</p></div></div>';
}
function parse(){
  const h=(location.hash||'#/entrar').slice(2); const [path,qs]=h.split('?'); const parts=path.split('/');
  const q={}; (qs||'').split('&').forEach(kv=>{ if(kv){ const [k,v]=kv.split('='); q[k]=decodeURIComponent(v||''); } });
  return {route:parts[0]||'entrar', arg:parts[1], q};
}
function render(){
  const {route,arg,q}=parse();
  closeModal();
  if(route==='entrar' || !S.role || !S.consent){ if(route!=='entrar'){ location.hash='#/entrar'; return; } $('#app').innerHTML=R.entrar(); R.entrar.after(); return; }
  if(!R[route]){ location.hash='#/painel'; return; }
  const nav=NAV.find(n=>n.r===route);
  if(nav && !nav.roles.includes(S.role)){ toast('Essa tela não faz parte do perfil '+USERS[S.role].papel.split(',')[0]+'.'); location.hash='#/painel'; return; }
  document.title=TITLES[route]+' | UrbanGuard';
  $('#app').innerHTML=shell(route, R[route](arg,q));
  if(R[route].after) R[route].after(arg,q);
  $('#role').onchange=(e)=>{ const v=e.target.value; if(v==='sair'){ S.role=null; save(); location.hash='#/entrar'; return; } S.role=v; save(); const n=NAV.find(x=>x.r===route); if(n && !n.roles.includes(v)) location.hash='#/painel'; else render(); toast('Você está vendo a plataforma como '+USERS[v].nome+' ('+USERS[v].papel+').'); };
  window.scrollTo(0,0);
}
// Atualização simulada dos dados (RNF01): nova sincronização a cada 30 s
setInterval(()=>{ const s=$('#secs'); if(!s) return; let secs=Math.round((Date.now()-S.lastSync)/1000); if(secs>=30){ S.lastSync=Date.now(); secs=0; save(); } s.textContent=secs; },1000);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
window.addEventListener('hashchange', render);
window.UG = {closeModal};
if(!location.hash) location.hash = S.role&&S.consent ? '#/painel' : '#/entrar';
render();
})();
</script>
